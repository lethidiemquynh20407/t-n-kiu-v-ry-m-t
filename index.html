<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"


<title>Thank You</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#01030b;
}

canvas{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:block;
}

.message{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate3d(-50%,-50%,0);
    width:min(90vw,900px);
    text-align:center;
    color:white;
    z-index:10;
    pointer-events:none;
}

.message h1{
    font-family:Georgia,serif;
    font-size:clamp(24px,4.5vw,58px);
    font-weight:normal;
    line-height:1.3;
    text-shadow:
        0 0 10px rgba(255,255,255,.6),
        0 0 25px rgba(255,220,100,.25);
}

@media(max-width:600px){

    .message{
        width:88vw;
    }

    .message h1{
        font-size:clamp(21px,6vw,34px);
        line-height:1.25;
    }
}

@media(max-width:380px){

    .message{
        width:90vw;
    }

    .message h1{
        font-size:20px;
        line-height:1.25;
    }
}

</style>

</head>

<body>

<canvas id="canvas"></canvas>

<div class="message">

    <h1>
        Thank you for staying with me until the very last note—it means more than you know.
    </h1>

</div>

<script>


// =====================================================
// CANVAS
// =====================================================

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W;
let H;
let DPR;


// =====================================================
// RESIZE
// =====================================================

function resize(){

    W = window.innerWidth;

    H = window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    createBackgroundStars();
}

window.addEventListener(
    "resize",
    resize
);


// =====================================================
// SAO NỀN
// =====================================================

const backgroundStars = [];

function createBackgroundStars(){

    backgroundStars.length = 0;

    const amount =
        Math.min(
            220,
            Math.floor(W * H / 6500)
        );

    for(let i=0;i<amount;i++){

        backgroundStars.push({

            x:
                Math.random() * W,

            y:
                Math.random() * H,

            size:
                Math.random() * 1.4 + .3,

            alpha:
                Math.random() * .7 + .2,

            phase:
                Math.random() * Math.PI * 2,

            speed:
                Math.random() * .02 + .005
        });
    }
}


// =====================================================
// TÊN
// =====================================================

const names = [

    "Diễm Quỳnh",

    "Tuyết\u00A0Phi",

    "Nhã Thi",

    "Trúc Lam",

    "Thảo Vy"

];

let nameIndex = 0;


// =====================================================
// VỊ TRÍ AN TOÀN
// =====================================================

let safePositionIndex = 0;

function getSafePosition(){

    let positions;

    // ĐIỆN THOẠI
    if(W < 600){

        positions = [

            {
                x:W * .20,
                y:H * .18
            },

            {
                x:W * .80,
                y:H * .18
            },

            {
                x:W * .50,
                y:H * .10
            },

            {
                x:W * .20,
                y:H * .87
            },

            {
                x:W * .80,
                y:H * .87
            }

        ];

    }

    // MÁY TÍNH
    else{

        positions = [

            {
                x:W * .17,
                y:H * .20
            },

            {
                x:W * .83,
                y:H * .20
            },

            {
                x:W * .50,
                y:H * .11
            },

            {
                x:W * .17,
                y:H * .83
            },

            {
                x:W * .83,
                y:H * .83
            }

        ];

    }

    const position =
        positions[
            safePositionIndex %
            positions.length
        ];

    safePositionIndex++;

    return {
        x:position.x,
        y:position.y
    };
}


// =====================================================
// 🎆 HỆ THỐNG PHÁO HOA
// =====================================================

const fireworks = [];

const fireworkParticles = [];

const fireworkColors = [

    "#ff4d6d",
    "#ff8c42",
    "#ffe066",
    "#4dd9ff",
    "#7cff6b",
    "#c77dff",
    "#ffffff"

];


class Firework{

    constructor(){

        this.x =
            W * .08 +
            Math.random() * W * .84;

        this.y =
            H + 30;

        this.targetY =
            H * .08 +
            Math.random() * H * .43;

        this.speed =
            5.5 +
            Math.random() * 1.8;

        this.color =
            fireworkColors[
                Math.floor(
                    Math.random() *
                    fireworkColors.length
                )
            ];

        this.trail = [];

        this.dead = false;
    }


    update(){

        this.y -= this.speed;

        this.trail.push({
            x:this.x,
            y:this.y
        });

        if(this.trail.length > 15){

            this.trail.shift();
        }

        if(this.y <= this.targetY){

            this.explode();

            this.dead = true;
        }
    }


    explode(){

        const amount =
            W < 600
            ? 55
            : 90;

        for(
            let i=0;
            i<amount;
            i++
        ){

            const angle =
                Math.random() *
                Math.PI * 2;

            const speed =
                1.5 +
                Math.random() * 4;

            fireworkParticles.push({

                x:this.x,

                y:this.y,

                vx:
                    Math.cos(angle) *
                    speed,

                vy:
                    Math.sin(angle) *
                    speed,

                gravity:.035,

                drag:.985,

                life:1,

                decay:
                    .008 +
                    Math.random() * .008,

                size:
                    Math.random() * 1.8 + .7,

                color:this.color

            });
        }
    }


    draw(){

        for(
            let i=0;
            i<this.trail.length;
            i++
        ){

            const p =
                this.trail[i];

            const alpha =
                i / this.trail.length;

            ctx.globalAlpha =
                alpha * .7;

            ctx.fillStyle =
                this.color;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                1.5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.globalAlpha = 1;

        ctx.fillStyle =
            this.color;

        ctx.shadowColor =
            this.color;

        ctx.shadowBlur = 12;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            2.5,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
    }

}


// =====================================================
// UPDATE PHÁO HOA
// =====================================================

function updateFireworkParticles(){

    for(
        let i=fireworkParticles.length-1;
        i>=0;
        i--
    ){

        const p =
            fireworkParticles[i];

        p.x += p.vx;

        p.y += p.vy;

        p.vx *= p.drag;

        p.vy *= p.drag;

        p.vy += p.gravity;

        p.life -= p.decay;

        if(p.life <= 0){

            fireworkParticles.splice(
                i,
                1
            );
        }
    }
}


// =====================================================
// VẼ PHÁO HOA
// =====================================================

function drawFireworkParticles(){

    for(
        const p of fireworkParticles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );

        ctx.fillStyle =
            p.color;

        ctx.shadowColor =
            p.color;

        ctx.shadowBlur = 7;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;

    ctx.shadowBlur = 0;
}


// =====================================================
// ⭐ HỆ THỐNG SAO + TÊN
// =====================================================

const nameRockets = [];

const nameExplosions = [];


// =====================================================
// VẼ SAO
// =====================================================

function drawStar(
    x,
    y,
    size,
    alpha=1
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.globalAlpha =
        alpha;

    ctx.fillStyle =
        "#FFD83D";

    ctx.shadowColor =
        "#FFD83D";

    ctx.shadowBlur = 18;

    ctx.beginPath();

    for(
        let i=0;
        i<10;
        i++
    ){

        const angle =
            -Math.PI/2 +
            i * Math.PI/5;

        const radius =
            i % 2 === 0
            ? size
            : size * .4;

        const px =
            Math.cos(angle) *
            radius;

        const py =
            Math.sin(angle) *
            radius;

        if(i === 0){

            ctx.moveTo(
                px,
                py
            );

        }else{

            ctx.lineTo(
                px,
                py
            );
        }
    }

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


// =====================================================
// SAO BAY
// =====================================================

class NameRocket{

    constructor(name){

        this.name =
            name;

        const target =
            getSafePosition();

        this.targetX =
            target.x;

        this.targetY =
            target.y;

        this.x =
            this.targetX;

        this.y =
            H + 40;

        this.speed =
            3.5 +
            Math.random() * 1.3;

        this.trail = [];

        this.dead = false;
    }


    update(){

        this.y -=
            this.speed;

        this.trail.push({
            x:this.x,
            y:this.y
        });

        if(
            this.trail.length > 12
        ){

            this.trail.shift();
        }

        if(
            this.y <=
            this.targetY
        ){

            this.dead = true;

            createNameExplosion(

                this.targetX,

                this.targetY,

                this.name

            );
        }
    }


    draw(){

        for(
            let i=0;
            i<this.trail.length;
            i++
        ){

            const p =
                this.trail[i];

            ctx.globalAlpha =
                (
                    i /
                    this.trail.length
                ) * .5;

            ctx.fillStyle =
                "#FFD83D";

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                1.4,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.globalAlpha = 1;

        drawStar(
            this.x,
            this.y,
            7
        );
    }

}


// =====================================================
// NỔ SAO
// =====================================================

function createNameExplosion(
    x,
    y,
    name
){

    const stars = [];

    const amount =
        W < 600
        ? 75
        : 120;

    for(
        let i=0;
        i<amount;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            1.5 +
            Math.random() * 4.8;

        stars.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                Math.random() * 3 + 1,

            life:1,

            drag:.985,

            gravity:
                .008 +
                Math.random() * .012

        });
    }

    nameExplosions.push({

        x:x,

        y:y,

        name:name,

        stars:stars,

        flash:1

    });
}


// =====================================================
// UPDATE SAO NỔ
// =====================================================

function updateNameExplosions(){

    for(
        const explosion of
        nameExplosions
    ){

        explosion.flash *= .92;

        for(
            const s of
            explosion.stars
        ){

            s.x += s.vx;

            s.y += s.vy;

            s.vx *= s.drag;

            s.vy *= s.drag;

            s.vy += s.gravity;

            s.life =
                Math.max(
                    .45,
                    s.life - .004
                );
        }
    }
}


// =====================================================
// VẼ SAO NỔ + TÊN
// =====================================================

function drawNameExplosions(){

    for(
        const explosion of
        nameExplosions
    ){

        if(
            explosion.flash > .03
        ){

            const radius =
                25 +
                (
                    1 -
                    explosion.flash
                ) * 90;

            const gradient =
                ctx.createRadialGradient(

                    explosion.x,
                    explosion.y,
                    0,

                    explosion.x,
                    explosion.y,
                    radius

                );

            gradient.addColorStop(
                0,
                `rgba(
                    255,
                    255,
                    210,
                    ${explosion.flash}
                )`
            );

            gradient.addColorStop(
                .25,
                `rgba(
                    255,
                    220,
                    50,
                    ${explosion.flash*.55}
                )`
            );

            gradient.addColorStop(
                1,
                "rgba(255,210,0,0)"
            );

            ctx.fillStyle =
                gradient;

            ctx.beginPath();

            ctx.arc(
                explosion.x,
                explosion.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        // Sao lan ra

        for(
            const s of
            explosion.stars
        ){

            drawStar(
                s.x,
                s.y,
                s.size,
                s.life
            );
        }


        // =========================================
        // TÊN LUÔN Ở LẠI
        // =========================================

        ctx.save();

        ctx.font =
            `bold ${
                Math.max(
                    19,
                    W * .022
                )
            }px Arial, sans-serif`;

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillStyle =
            "#FFFBE0";

        ctx.shadowColor =
            "#FFD83D";

        ctx.shadowBlur = 22;

        ctx.fillText(
            explosion.name,
            explosion.x,
            explosion.y
        );

        ctx.restore();
    }
}


// =====================================================
// PHÓNG PHÁO HOA + SAO
// =====================================================

function launchBoth(){

    // 🎆 Pháo hoa riêng

    fireworks.push(
        new Firework()
    );


    // ⭐ Sao + tên riêng

    if(
        nameIndex <
        names.length
    ){

        nameRockets.push(
            new NameRocket(
                names[nameIndex]
            )
        );

        nameIndex++;
    }
}


// =====================================================
// CHẠM MÀN HÌNH
// =====================================================

window.addEventListener(
    "pointerdown",
    () => {
        launchBoth();
    }
);


// =====================================================
// ANIMATION
// =====================================================

let lastTime =
    performance.now();


function animate(now){

    const dt =
        Math.min(
            (now-lastTime) /
            16.67,
            2
        );

    lastTime =
        now;


    // Nền trời

    ctx.fillStyle =
        "rgba(1,3,11,.20)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // ==========================================
    // SAO NỀN
    // ==========================================

    for(
        const s of
        backgroundStars
    ){

        s.phase +=
            s.speed * dt;

        const alpha =
            s.alpha +
            Math.sin(
                s.phase
            ) * .15;

        ctx.globalAlpha =
            alpha;

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;


    // ==========================================
    // 🎆 PHÁO HOA
    // ==========================================

    for(
        let i =
            fireworks.length - 1;

        i >= 0;

        i--
    ){

        const f =
            fireworks[i];

        f.update();

        f.draw();

        if(f.dead){

            fireworks.splice(
                i,
                1
            );
        }
    }

    updateFireworkParticles();

    drawFireworkParticles();


    // ==========================================
    // ⭐ SAO + TÊN
    // ==========================================

    for(
        let i =
            nameRockets.length - 1;

        i >= 0;

        i--
    ){

        const r =
            nameRockets[i];

        r.update();

        r.draw();

        if(r.dead){

            nameRockets.splice(
                i,
                1
            );
        }
    }

    updateNameExplosions();

    drawNameExplosions();


    requestAnimationFrame(
        animate
    );
}


// =====================================================
// KHỞI ĐỘNG
// =====================================================

resize();

animate(
    performance.now()
);


// =====================================================
// TỰ ĐỘNG PHÓNG
// =====================================================

setTimeout(
    launchBoth,
    800
);

setTimeout(
    launchBoth,
    2700
);

setTimeout(
    launchBoth,
    4600
);

setTimeout(
    launchBoth,
    6500
);

setTimeout(
    launchBoth,
    8400
);

</script>

</body>
</html>
